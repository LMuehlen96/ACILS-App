<!doctype html><html lang="de"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="ACiLS Kurs-Cockpit – Prototyp der DGINA ACiLS Kurs-App (Pitch-Demo, fiktive Daten)"><meta name="theme-color" content="#8C1D18"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ACiLS Kurs-Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --ground:#F5F7F9; --surface:#FFFFFF; --surface-2:#EFF2F5; --line:#E1E6EC;
  --ink:#15202B; --muted:#5C6976; --faint:#8A96A2;
  --accent:#8C1D18; --accent-ink:#6B1310; --accent-soft:#F4E0DD;
  --steel:#5A6672;
  --violet:#6C4BD8; --violet-soft:#ECE6FB;
  --g-rot:#C0392B; --g-gelb:#C98A12; --g-gruen:#3F9E5A; --g-blau:#3B77C4;
  --sev-ok:#2E9E5B; --sev-warn:#C98A12; --sev-crit:#C0392B;
  --shadow:0 1px 2px rgba(20,32,43,.05),0 8px 24px -12px rgba(20,32,43,.14);
  --radius:14px;
  --dsp:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0F1319; --surface:#161D25; --surface-2:#1D2630; --line:#28323D;
  --ink:#E7ECF1; --muted:#9BA7B3; --faint:#6C7986;
  --accent:#E0786F; --accent-ink:#F3BAB4; --accent-soft:#3C1D1A;
  --steel:#93A0AD;
  --violet:#A48BF0; --violet-soft:#241B3D;
  --g-rot:#E07A6E; --g-gelb:#E0A93C; --g-gruen:#5CBE77; --g-blau:#5C95DE;
  --sev-ok:#4CBE7A; --sev-warn:#E0A93C; --sev-crit:#E07A6E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --ground:#0F1319; --surface:#161D25; --surface-2:#1D2630; --line:#28323D;
  --ink:#E7ECF1; --muted:#9BA7B3; --faint:#6C7986;
  --accent:#E0786F; --accent-ink:#F3BAB4; --accent-soft:#3C1D1A; --steel:#93A0AD;
  --violet:#A48BF0; --violet-soft:#241B3D;
  --g-rot:#E07A6E; --g-gelb:#E0A93C; --g-gruen:#5CBE77; --g-blau:#5C95DE;
  --sev-ok:#4CBE7A; --sev-warn:#E0A93C; --sev-crit:#E07A6E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--dsp);text-wrap:balance;margin:0;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);font-weight:600}
.logo{height:26px;width:auto;display:block}
.logoplate{background:#fff;border-radius:9px;padding:6px 9px;display:inline-flex;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);max-width:456px;width:100%;padding:34px 30px}
.login-card .logoplate{margin-bottom:20px}
.login-card .logo{height:34px}
.login-card h1{font-size:23px;margin-bottom:6px}
.login-card p.sub{color:var(--muted);margin:0 0 22px;font-size:14px}
.role-btn{display:flex;gap:13px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;margin-bottom:11px;transition:border-color .15s,background .15s}
.role-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.role-btn .ico{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:17px}
.role-btn .t{font-weight:600}
.role-btn .d{font-size:12.5px;color:var(--muted)}
.demo-note{margin-top:16px;font-size:12px;color:var(--faint);border-top:1px dashed var(--line);padding-top:13px}

/* start / courses screen */
#screen{min-height:100vh;padding:34px 20px 60px;max-width:900px;margin:0 auto}
#screen.hide{display:none}
.screen-head{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.screen-head h1{font-size:24px}
.screen-head .sh-sub{color:var(--muted);font-size:13.5px}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ccard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 17px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .1s}
.ccard:hover{border-color:var(--accent);transform:translateY(-1px)}
.ccard .cn{font-family:var(--dsp);font-weight:700;font-size:16.5px}
.ccard .cd{font-size:13px;color:var(--muted)}
.ccard .cmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.status{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
.status.live{background:color-mix(in srgb,var(--sev-ok) 18%,transparent);color:var(--sev-ok)}
.status.plan{background:var(--surface-2);color:var(--faint)}
.newcourse{margin-top:16px}
.newbtn{width:100%;border:2px dashed var(--line);background:var(--surface-2);border-radius:var(--radius);padding:16px;font-size:15px;font-weight:600;color:var(--accent-ink);display:flex;gap:10px;align-items:center;justify-content:center}
.newbtn:hover{border-color:var(--accent);background:var(--accent-soft)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);max-width:520px;margin:0 auto;padding:26px 26px 24px}
.panel h2{font-size:20px;margin-bottom:4px}
.panel .p-sub{color:var(--muted);font-size:13.5px;margin-bottom:18px}
.pin{font-family:var(--mono);letter-spacing:.28em;font-size:17px;text-align:center;width:100%;padding:11px}
.crumbs{background:none;border:0;color:var(--accent);font-weight:600;font-size:13px;padding:0;margin-bottom:16px}
.rolepick{display:flex;gap:10px;margin-bottom:16px}
.rolepick button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-weight:600;font-size:14px;color:var(--muted)}
.rolepick button.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.pinhint{font-size:12px;color:var(--faint);margin-top:7px}
select.big{width:100%;padding:11px}

#app{display:none;min-height:100vh;grid-template-columns:238px 1fr}
#app.on{display:grid}
aside{background:var(--surface);border-right:1px solid var(--line);padding:16px 15px;display:flex;flex-direction:column;gap:5px;position:sticky;top:0;height:100vh}
aside .logoplate{margin-bottom:12px;align-self:flex-start}
aside .ctx{background:var(--surface-2);border-radius:11px;padding:11px 12px;margin-bottom:12px}
aside .ctx .k{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.09em}
aside .ctx .v{font-weight:600;font-size:13.5px;line-height:1.3}
.nav{font-size:14px;color:var(--muted);border:0;background:none;border-radius:10px;padding:9px 11px;text-align:left;display:flex;align-items:center;gap:9px;width:100%;font-weight:500}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.55}
aside .foot{margin-top:auto;font-size:12px;color:var(--faint)}
.linkish{color:var(--accent);background:none;border:0;padding:0;font-weight:600;font-size:13px}

main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--ground) 86%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar h2{font-size:19px}
.topbar .backbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;width:34px;height:34px;font-size:18px;line-height:1;display:grid;place-items:center;flex:none;cursor:pointer}
.topbar .backbtn:hover{border-color:var(--accent);color:var(--accent-ink)}
.topbar .who{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 8px 5px 13px;cursor:pointer;font-weight:600}
.topbar .who:hover{border-color:var(--accent)}
.who .caret{color:var(--faint);font-size:11px}
.menu{position:absolute;top:56px;right:26px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:7px;min-width:238px;max-height:70vh;overflow:auto;display:none;z-index:20}
.menu.on{display:block}
.menu-h{font-size:12px;color:var(--muted);padding:8px 10px 9px;border-bottom:1px solid var(--line);margin-bottom:5px}
.menu-h b{color:var(--ink);font-size:13.5px}
.menu-s{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700;padding:8px 10px 4px}
.menu-i{display:block;width:100%;text-align:left;background:none;border:0;border-radius:9px;padding:9px 10px;font-size:13.5px;color:var(--ink);font-weight:500}
.menu-i:hover{background:var(--surface-2)}
.menu-i.act{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.menu-div{height:1px;background:var(--line);margin:6px 4px}
.room button.sess{display:block;width:100%;text-align:left;background:none;font:inherit;color:inherit;cursor:pointer}
.room button.sess:hover .nm{color:var(--accent-ink)}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;font-family:var(--dsp)}
.wrap{padding:22px 26px 60px;max-width:1160px;width:100%}
.banner{background:var(--accent-soft);color:var(--accent-ink);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:11px;padding:9px 13px;font-size:12.5px;margin-bottom:18px;display:flex;gap:8px;align-items:center}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.gdot{width:9px;height:9px;border-radius:50%;flex:none}
.g-rot{background:var(--g-rot)}.g-gelb{background:var(--g-gelb)}.g-gruen{background:var(--g-gruen)}.g-blau{background:var(--g-blau)}
.tx-rot{color:var(--g-rot)}.tx-gelb{color:var(--g-gelb)}.tx-gruen{color:var(--g-gruen)}.tx-blau{color:var(--g-blau)}
.tbadge{font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:2px 7px;border-radius:6px;text-transform:uppercase}
.t-Szenario{background:var(--accent-soft);color:var(--accent-ink)}
.t-Workshop{background:color-mix(in srgb,var(--steel) 20%,transparent);color:var(--steel)}
.t-Vortrag{background:color-mix(in srgb,var(--g-blau) 16%,transparent);color:var(--g-blau)}
.t-Demo{background:var(--violet-soft);color:var(--violet)}
.t-Pause,.t-Orga,.t-Skill{background:var(--surface-2);color:var(--faint)}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px}
.pill.eval{background:var(--accent-soft);color:var(--accent-ink)}
.pill.dev{background:var(--violet-soft);color:var(--violet)}
.pill.issue{background:color-mix(in srgb,var(--sev-warn) 18%,transparent);color:var(--sev-warn)}
.sev{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.sev .b{width:8px;height:8px;border-radius:2px}
.sev.ok .b{background:var(--sev-ok)}.sev.warn .b{background:var(--sev-warn)}.sev.crit .b{background:var(--sev-crit)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px}
.kpi .n{font-family:var(--dsp);font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.kpi .l{font-size:12.5px;color:var(--muted);margin-top:5px}
.kpi .trend{font-size:11.5px;color:var(--faint);margin-top:8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card .hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card .hd h3{font-size:15.5px}
.card .bd{padding:6px 16px 15px}
.section-title{font-size:13px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.09em;margin:26px 0 12px}

.grid{display:grid;gap:14px}
.g-groups{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.g-plan{grid-template-columns:repeat(auto-fill,minmax(232px,1fr))}
.room{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.room h4{margin:0 0 3px;font-family:var(--dsp);font-size:15px;display:flex;align-items:center;gap:7px}
.room .rt{font-size:12px;color:var(--muted);margin-bottom:8px}
.room .sess{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
.room .sess .tm{font-family:var(--mono);font-size:11px;color:var(--faint)}
.room .sess .nm{font-weight:600;font-size:12.5px;margin:1px 0 2px}
.room .names{color:var(--muted);font-size:11.5px}
.room .sr{display:flex;gap:6px;align-items:center;margin-top:4px;flex-wrap:wrap}

.ppl{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.person{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 11px 4px 5px;font-size:13px}
.person .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700;font-family:var(--dsp)}
.qual{display:inline-block;font-size:10.5px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:6px;padding:1px 7px;margin-left:6px;white-space:nowrap}
.pcells{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.pcell{border:1px solid var(--line);border-radius:11px;padding:9px 11px;background:var(--surface)}
.pcell-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pcell-h .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700;font-family:var(--dsp)}
.pcell-n{font-weight:600;font-size:13.5px}
.pcell-fb{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.45;border-top:1px dashed var(--line);padding-top:6px}
.fbtag{display:inline-block;font-size:10.5px;font-weight:800;font-family:var(--dsp);color:#fff;background:var(--violet);border-radius:6px;padding:1px 7px;margin-right:7px}
.pcell-src{color:var(--faint)}
.pcell-ort{font-size:11px;color:var(--faint)}
.pcell-ort::before{content:"📍 "}

.daytabs{display:flex;gap:8px;margin-bottom:16px}
.daytab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 15px;font-size:13px;font-weight:600;color:var(--muted)}
.daytab.active{background:var(--ink);color:var(--ground);border-color:var(--ink)}

.tl{position:relative;margin-left:6px;padding-left:20px;border-left:2px solid var(--line)}
.slot{position:relative;margin-bottom:11px}
.slot::before{content:"";position:absolute;left:-27px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.slot.ctx::before{border-color:var(--faint);width:8px;height:8px;left:-26px}
.slotcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.slot.ctx .slotcard{background:none;box-shadow:none;border-style:dashed}
.slothd{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;width:100%;background:none;border:0;text-align:left}
.slot.mine .slothd{cursor:pointer}
.slot.mine .slothd:hover{background:var(--surface-2)}
.slothd .tm{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:92px;padding-top:2px}
.slothd .ti{flex:1;min-width:0}
.slothd .ti .name{font-weight:600;font-size:14px}
.slot.ctx .slothd .ti .name{font-weight:500;color:var(--muted)}
.slothd .ti .meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag-right{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.expand{border-top:1px solid var(--line);padding:13px 14px;display:none;background:var(--surface-2)}
.slot.open .expand{display:block}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;font-size:13px;font-weight:600;color:var(--ink);display:inline-flex;gap:7px;align-items:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.sm{padding:6px 10px;font-size:12.5px}
.you{font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);padding:2px 8px;border-radius:999px}

.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px;align-items:flex-end}
select,input[type=text],textarea{font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
select:focus,input:focus,textarea:focus,button:focus-visible,.nav:focus-visible,.role-btn:focus-visible,.slothd:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filters label{font-size:11px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.06em;display:flex;flex-direction:column;gap:4px}

.steps{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600}
.step .num{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px}
.step.done .num{background:var(--accent);border-color:var(--accent);color:#fff}
.step.active .num{border-color:var(--accent);color:var(--accent-ink)}
.step .arrow{color:var(--faint)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px}
.field input[type=text]{width:100%}
.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:20px;text-align:center;color:var(--muted);background:var(--surface-2)}
.drop.ok{border-color:var(--sev-ok);background:color-mix(in srgb,var(--sev-ok) 8%,var(--surface));color:var(--ink)}
.drop strong{color:var(--ink)}
.parsehint{font-size:12px;color:var(--faint);margin-top:8px}

.modal-bg{position:fixed;inset:0;background:rgba(10,16,22,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-bg.on{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);max-width:520px;width:100%;max-height:90vh;overflow:auto}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mh h3{font-size:17px}
.modal .mb{padding:16px 20px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.rate{display:flex;gap:6px}
.rate button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-family:var(--dsp)}
.rate button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
textarea{width:100%;min-height:74px;resize:vertical}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.sel{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.fbtype{margin-bottom:2px}
.fbtype button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.cgrid{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.cgrid:last-child{border-bottom:0}
.clbl{font-size:12.8px}
.cscale{display:flex;gap:5px;flex:none}
.cscale button{width:29px;height:29px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-family:var(--dsp);font-size:13px;color:var(--ink)}
.cscale button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;margin-top:4px}
.check input{width:16px;height:16px}
.glegend{font-size:11.5px;color:var(--muted);background:var(--surface-2);border-radius:9px;padding:8px 10px;margin:10px 0}
.mini{min-height:44px!important;margin-top:6px;font-size:12.5px}
.phase{border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-top:12px;background:var(--surface)}
.phase-h{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.phase-h b{display:inline-block;font-family:var(--dsp);font-size:11px;letter-spacing:.08em;font-weight:800;color:#fff;background:var(--accent);border-radius:6px;padding:2px 7px;margin-right:7px}
.cscale button.gr1{background:var(--sev-ok);border-color:var(--sev-ok);color:#fff}
.cscale button.gr2{background:color-mix(in srgb,var(--sev-ok) 62%,var(--sev-warn));border-color:transparent;color:#fff}
.cscale button.gr3{background:var(--sev-warn);border-color:var(--sev-warn);color:#fff}
.cscale button.gr4{background:color-mix(in srgb,var(--sev-warn) 45%,var(--sev-crit));border-color:transparent;color:#fff}
.cscale button.gr5{background:var(--sev-crit);border-color:var(--sev-crit);color:#fff}
.subtabs{display:flex;gap:6px;margin-bottom:14px}
.subtabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;font-size:13px;font-weight:600;color:var(--muted)}
.subtabs button.sel{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.notegrade{font-weight:800;font-family:var(--dsp);font-variant-numeric:tabular-nums}
.agg{width:100%;border-collapse:collapse;font-size:13px}
.agg th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
.agg td{padding:9px 10px;border-bottom:1px solid var(--line)}
.agg tr:last-child td{border-bottom:0}
.agg .nm{font-weight:600}
.agg .num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:center}
.gradepill{display:inline-block;min-width:34px;text-align:center;font-family:var(--dsp);font-weight:800;font-size:13px;color:#fff;border-radius:7px;padding:3px 7px}
.aggsub{font-size:12.5px;color:var(--muted);margin:2px 0 12px}
.cdsec{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-bottom:6px}
.checkcard{border:1px solid var(--line);border-left-width:4px;border-radius:12px;padding:11px 13px;background:var(--surface)}
.checkcard.ok{border-left-color:var(--sev-ok)}
.checkcard.warn{border-left-color:var(--sev-crit)}
.cc-h{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.cc-i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;flex:none}
.checkcard.ok .cc-i{background:var(--sev-ok)}.checkcard.warn .cc-i{background:var(--sev-crit)}
.cc-cat{font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--faint)}
.cc-t{font-weight:600;font-size:13.5px}
.cc-d{font-size:12.5px;color:var(--muted);margin:3px 0 7px}
.cc-p{display:flex;flex-wrap:wrap;gap:5px}
.ppill{font-size:11px;font-weight:600;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:2px 7px}
.ppill.sen{background:var(--accent-soft);color:var(--accent-ink)}
.cdtask{display:flex;align-items:flex-start;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.cdtask:last-child{border-bottom:0}
.cdtask input{width:17px;height:17px;margin-top:2px;flex:none}
.cdtask-b{flex:1;min-width:0}
.cdtask-t{display:block;font-size:13.5px;font-weight:500}
.cdtask-t.done{color:var(--faint);text-decoration:line-through}
.cdtask-m{display:block;font-size:11.5px;color:var(--faint);margin-top:2px}
.due{font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.due.ok{background:color-mix(in srgb,var(--sev-ok) 18%,transparent);color:var(--sev-ok)}
.due.warn{background:color-mix(in srgb,var(--sev-warn) 20%,transparent);color:var(--sev-warn)}
.due.crit{background:color-mix(in srgb,var(--sev-crit) 18%,transparent);color:var(--sev-crit)}
.agg tr.clk{cursor:pointer}
.agg tr.clk:hover{background:var(--surface-2)}
.agg .go{color:var(--faint);text-align:right;font-weight:700}
.pcard{border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-top:10px;background:var(--surface)}
.pcard-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pcard-n{font-weight:700;font-size:14px}
.pcard-b{margin-top:9px}
.seg.role button{padding:5px 9px;font-size:11.5px}
.detrow{border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:10px;background:var(--surface)}
.deth{font-weight:600;font-size:13.5px;margin-bottom:7px}
.detgr,.detph{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:12.5px;margin:3px 0}
.detph b{display:inline-block;font-family:var(--dsp);font-size:10.5px;letter-spacing:.06em;font-weight:800;color:#fff;background:var(--accent);border-radius:5px;padding:1px 6px;margin-right:4px}
.gcell{display:inline-flex;align-items:center;gap:4px;color:var(--muted)}
.detnote{font-size:12.5px;color:var(--muted);margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.rolebadge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;margin-right:6px}
.rolebadge.tl{background:var(--accent);color:#fff}
.rolebadge.tm{background:var(--surface-2);color:var(--muted)}
/* Persönliche App-Hülle: Account-Login + untere Tab-Leiste */
.acc-list{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.acc-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.acc-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.acc-av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--dsp);flex:none}
.acc-n{font-weight:600}.acc-r{font-size:12px;color:var(--muted)}
.acc-lv{margin-left:auto;font-family:var(--dsp);font-weight:800;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
#personal{max-width:760px;margin:0 auto;padding:22px 18px 96px}
.ptop{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.ptop h1{font-size:20px}.ptop .sub{font-size:12.5px;color:var(--muted)}
.ptop .logout{margin-left:auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{flex:1;border:0;background:none;color:var(--muted);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:10px;font-family:inherit;cursor:pointer}
.tabbar button .ic{font-size:18px;line-height:1}
.tabbar button.on{color:var(--accent-ink);background:var(--accent-soft)}
.kfilter{display:flex;gap:7px;margin:2px 0 14px}
.kfilter button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 15px;font-size:13px;font-weight:600;color:var(--muted);font-family:inherit;cursor:pointer}
.kfilter button.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px}
.kcard .kn{font-family:var(--dsp);font-weight:700;font-size:16px}
.kcard .kd{font-size:13px;color:var(--muted);margin-top:2px}
.kcard .kmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px;align-items:center}
.rolechip{font-family:var(--dsp);font-weight:800;font-size:11px;padding:2px 10px;border-radius:999px;background:var(--accent);color:#fff}
.stapp{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
.stapp.gebucht{background:color-mix(in srgb,var(--sev-ok) 18%,transparent);color:var(--sev-ok)}
.stapp.angefragt{background:color-mix(in srgb,var(--sev-warn) 20%,transparent);color:var(--sev-warn)}
.stapp.offen{background:var(--surface-2);color:var(--faint)}
.thread{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.thread .tt{font-weight:600}.thread .tm{font-size:12px;color:var(--muted);margin-top:3px}.thread .tr{font-size:11.5px;color:var(--faint);margin-top:6px}
.msg{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.msg:last-child{border-bottom:0}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}.setrow .sl{font-size:14px;font-weight:500}.setrow .sd{font-size:12px;color:var(--muted)}
.toggle{width:44px;height:26px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);position:relative;flex:none;cursor:pointer}
.toggle.on{background:var(--sev-ok);border-color:transparent}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on::after{left:20px}
.seg2{display:flex;gap:6px}.seg2 button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--muted);font-family:inherit;cursor:pointer}.seg2 button.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}

/* Kurschat */
.cmsg{display:flex;margin:7px 0}
.cmsg.me{justify-content:flex-end}
.cmsg .cb{max-width:82%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 11px}
.cmsg.me .cb{background:var(--accent-soft);border-color:transparent}
.cmsg .ch{font-size:11px;color:var(--faint);font-weight:600;margin-bottom:2px}
.cmsg .ct{font-size:13.5px;line-height:1.4}
.chatbar{display:flex;gap:8px;margin-top:10px}
.chatbar input{flex:1;min-width:0}

/* Instruktorenpfad */
.pf-badge{display:inline-block;font-family:var(--dsp);font-weight:800;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--accent);color:#fff;letter-spacing:.03em}
.pf-meter{height:11px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin:9px 0 5px}
.pf-meter>i{display:block;height:100%;background:var(--sev-ok);border-radius:999px;transition:width .3s}
.pf-sub{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.pf-sub:last-child{border-bottom:0}
.pf-sub .m{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.pf-sub .m.ok{background:color-mix(in srgb,var(--sev-ok) 18%,transparent);color:var(--sev-ok)}
.pf-sub .m.no{background:var(--surface-2);color:var(--faint)}
.pf-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:12px 0 2px}
.pf-legend span{display:inline-flex;align-items:center;gap:6px}
.pf-legend i{width:11px;height:11px;border-radius:3px;display:inline-block;border:1px solid}
.pf-legend .l0{background:var(--surface-2);border-color:var(--faint)}
.pf-legend .l1{background:color-mix(in srgb,var(--sev-warn) 18%,transparent);border-color:var(--sev-warn)}
.pf-legend .l2{background:color-mix(in srgb,var(--sev-ok) 18%,transparent);border-color:var(--sev-ok)}
.pf-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pf{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);border-radius:9px;padding:7px 11px;font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.pf i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.pf b{font-weight:600;font-size:11px;opacity:.75}
.pf[data-s="1"]{background:color-mix(in srgb,var(--sev-warn) 15%,transparent);color:var(--sev-warn);border-color:transparent}
.pf[data-s="1"] i{background:var(--sev-warn)}
.pf[data-s="2"]{background:color-mix(in srgb,var(--sev-ok) 15%,transparent);color:var(--sev-ok);border-color:transparent}
.pf[data-s="2"] i{background:var(--sev-ok)}
.pf[data-hard]{outline:1px dashed var(--line);outline-offset:1px}
.pf.na{opacity:.5;border-style:dashed;cursor:not-allowed;background:none}
.pf-fbrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.pf-fbrow:last-child{border-bottom:0}.pf-fbrow b{font-family:var(--dsp)}
/* live countdown widget */
.cdw{position:fixed;right:20px;bottom:20px;z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px 13px;width:250px}
.cdw.hidden{display:none}
.cdw.warn{border-color:var(--sev-warn)}.cdw.crit{border-color:var(--sev-crit);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--sev-crit) 45%,transparent)}50%{box-shadow:0 0 0 7px transparent}}
.cdw-x{position:absolute;top:8px;right:9px;background:none;border:0;color:var(--faint);font-size:18px;line-height:1}
.cdw-l{font-size:12px;color:var(--muted);font-weight:600;padding-right:16px}
.cdw-t{font-family:var(--dsp);font-weight:800;font-size:40px;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.cdw.warn .cdw-t{color:var(--sev-warn)}.cdw.crit .cdw-t{color:var(--sev-crit)}
.cdw-b{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin:8px 0 6px}
.cdw-b span{display:block;height:100%;background:var(--sev-ok);width:100%;transition:width .25s linear}
.cdw.warn .cdw-b span{background:var(--sev-warn)}.cdw.crit .cdw-b span{background:var(--sev-crit)}
.cdw-n{font-size:11.5px;color:var(--faint)}
.cdbig{font-family:var(--dsp);font-weight:800;font-size:22px;margin:6px 0 4px}
.cdsub{font-size:14px;color:var(--muted);margin-bottom:12px;font-weight:600}
.nextbox{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:15px;line-height:1.5}
.nextbox b{color:var(--accent-ink)}
.x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--ground);padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:80;box-shadow:var(--shadow)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.fbitem{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.fbitem:last-child{border-bottom:0}

@media (max-width:840px){
  #app.on{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px}
  aside .ctx,aside .foot{display:none}
  aside .logoplate{margin:0 auto 0 0}
  .nav{width:auto}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
.kpi-link{cursor:pointer;transition:border-color .15s,transform .05s}
.kpi-link:hover{border-color:var(--accent)}
.kpi-link:active{transform:scale(.99)}
.fac-row{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.fac-row:last-child{border-bottom:none}
.fac-row:hover{background:var(--surface-2)}
.fac-main{flex:1;min-width:0}
.fac-nm{font-weight:700;font-size:14.5px}
.fac-qual{font-size:10px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap;vertical-align:middle}
.q-arzt{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent-ink,var(--accent))}
.q-pflege{background:color-mix(in srgb,#B4690E 20%,transparent);color:#B4690E}
:root[data-theme="dark"] .q-pflege,:root:not([data-theme="light"]) .q-pflege{color:#E0A458}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .q-pflege{color:#E0A458}}
.fac-sub{color:var(--muted);font-size:12.5px;margin-top:1px}
.fac-el{color:var(--faint);font-size:11.5px;margin-top:3px}
.fac-right{text-align:right;flex:none;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.fac-st{font-size:11px;padding:2px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.fac-k{font-size:11px;color:var(--faint);white-space:nowrap}
.facmeta{display:grid;grid-template-columns:1fr 1fr;gap:9px 16px;margin-bottom:4px}
.facmeta>div{display:flex;flex-direction:column;min-width:0}
.facmeta span{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.facmeta b{font-size:13.5px;font-weight:600;margin-top:1px}
.pt-status{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:2px 0 12px}
.pt-clock{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.pt-prog{flex-basis:100%;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.pt-prog>i{display:block;height:100%;background:var(--accent);transition:width .45s linear}
.pt-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent);flex:none}
.pt-dot.off{background:var(--faint);box-shadow:none}
.plantbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.plantbl{border-collapse:collapse;width:100%;min-width:760px;font-size:12.5px}
.plantbl th{background:var(--surface-2);color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.plantbl td{border-bottom:1px solid var(--line);border-left:1px solid var(--line);vertical-align:top;padding:3px}
.plantbl td:first-child,.plantbl th:first-child{border-left:none}
.plantbl tr:last-child td{border-bottom:none}
.pt-time{cursor:pointer;white-space:nowrap;text-align:center;min-width:66px;background:var(--surface);transition:background .12s}
.pt-time:hover{background:var(--surface-2)}
.pt-t{font-weight:800;font-size:13px}
.pt-e{font-size:10px;color:var(--faint)}
.pt-badge{margin-top:4px;font-size:9px;font-weight:800;letter-spacing:.06em;color:#fff;background:var(--accent);border-radius:4px;padding:1px 4px;display:none}
tr.pt-now .pt-badge{display:inline-block}
.pt-c{min-width:130px}
.pt-plenum{background:var(--surface-2)}
.pt-empty{display:block;text-align:center;color:var(--faint);padding:6px 0}
.pt-sess{display:block;width:100%;text-align:left;background:transparent;border:none;border-radius:7px;padding:6px 7px;cursor:pointer;color:var(--ink)}
.pt-sess:hover{background:var(--surface-2)}
.pt-plenum .pt-sess:hover{background:var(--ground)}
.pt-nm{display:block;font-weight:700;font-size:12.5px;line-height:1.25}
.pt-metaline{display:inline-flex;gap:4px;align-items:center;margin-top:3px;flex-wrap:wrap}
.pt-inst{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.pt-note{display:block;color:var(--faint);font-size:10.5px;margin-top:2px;font-style:italic}
tr.pt-now>td{background:color-mix(in srgb,var(--accent) 9%,transparent)}
tr.pt-now .pt-time{background:color-mix(in srgb,var(--accent) 18%,transparent)}
tr.pt-now .pt-nm{color:var(--accent-ink,var(--accent))}
tr.pt-done>td{opacity:.5}
tr.pt-done .pt-time{opacity:1;color:var(--muted)}
tr.pt-done .pt-t::after{content:" ✓";color:#2E9E5B;font-weight:700}
</style>

function curBlock(){const day=SESS.filter(s=>s[0]===DAY);const times=[...new Set(day.map(s=>s[1]))].sort();let cur=null;for(const t of times){if(hm(t)<=LIVE.min)cur=t;else break;}const lastEnd=day.reduce((m,s)=>hm(s[2])>m?hm(s[2]):m,0);return {day,times,cur,lastEnd};}
function liveTick(){LIVE.min+=LIVE.speed;const{lastEnd}=curBlock();if(LIVE.min>lastEnd+2){LIVE.min=lastEnd;updateLive();liveStop(true);const el=document.getElementById('ptLive');if(el)el.innerHTML=liveStatusHtml()+' <b style="color:var(--accent-ink,var(--accent))">· Kurstag abgeschlossen</b>';toast("Kurstag abgeschlossen (Demo)");return;}updateLive();}
function updateLive(){const{cur,times}=curBlock();PNOW=cur;const tbl=document.querySelector('.plantbl');if(tbl){const nowIdx=cur?times.indexOf(cur):-1;tbl.querySelectorAll('tbody tr').forEach(tr=>{const st=tr.dataset.start,idx=times.indexOf(st);tr.className=(st===cur?'pt-now':(nowIdx>=0&&idx<nowIdx?'pt-done':''));});if(cur&&cur!==LIVE.last){const nr=tbl.querySelector('tr.pt-now');if(nr)nr.scrollIntoView({behavior:'smooth',block:'center'});}}LIVE.last=cur;const el=document.getElementById('ptLive');if(el)el.innerHTML=liveStatusHtml();}
function liveStatusHtml(){const day=SESS.filter(s=>s[0]===DAY);if(!PNOW)return `<span class="pt-dot off"></span>Kein aktueller Block – tippe links auf eine Uhrzeit${LIVE.on?'':' oder starte die Live-Demo'}.`;const grp=day.filter(s=>s[1]===PNOW);const end=grp.reduce((m,s)=>s[2]>m?s[2]:m,grp[0][2]);const title=[...new Set(grp.map(s=>s[4]))].join(" / ");let prog="",clock="";if(LIVE.on){const st=hm(PNOW),en=hm(end);const f=Math.max(0,Math.min(1,(LIVE.min-st)/Math.max(1,en-st)));prog=`<div class="pt-prog"><i style="width:${Math.round(f*100)}%"></i></div>`;clock=`<span class="pt-clock">🕐 ${fmtClock(LIVE.min)}</span> `;}return `<span class="pt-dot"></span>${clock}Aktueller Block: <b>${PNOW}–${end} · ${title}</b>${LIVE.on?'':` <button class="btn sm" style="margin-left:8px" onclick="setNow('${PNOW}')">Zurücksetzen</button>`}${prog}`;}

let COURSES=[
 {id:"fuerth",name:"ACiLS Providerkurs Fürth",dates:"26.–27.09.2026",venue:"INOB Fürth",start:"2026-09-26",code:"F",pin:"4726193580",status:"live"},
 {id:"aachen",name:"ACiLS Providerkurs Aachen",dates:"14.–15.11.2026",venue:"Uniklinik Aachen",start:"2026-11-14",code:"AC",pin:"1938274650",status:"plan"},
];
let CURRENT=null, LOGIN={role:"instructor"};
const screenEl=()=>document.getElementById("screen");
function showScreen(html){document.getElementById("app").classList.remove("on");const s=screenEl();s.classList.remove("hide");s.innerHTML=html;window.scrollTo(0,0);}
function backToCourses(){CURRENT=null;document.getElementById("app").classList.remove("on");if(ME){PTAB="kurse";personalShell();}else showAccountLogin();}

function showCourses(){showScreen(`<div class="screen-head"><div class="logoplate"><img class="logo" src="${LOGO}" alt="ACiLS"></div>
   <div><h1>ACiLS Kurs-Cockpit</h1><div class="sh-sub">Deine Kurse · Prototyp mit Demo-Daten</div></div></div>
  <div class="section-title" style="margin-top:0">Kurse</div>
  <div class="courses">${COURSES.map(c=>`<button class="ccard" onclick="showCourseLogin('${c.id}')">
     <div class="cn">${c.name}</div><div class="cd">${c.dates} · ${c.venue}</div>
     <div class="cmeta"><span class="status ${c.status==='live'?'live':'plan'}">${c.status==='live'?'aktiv':'geplant'}</span>
       <span class="chip">${SESS.length} Programmpunkte</span><span class="chip">${Object.keys(faculty).length} Faculty</span></div></button>`).join("")}</div>
  <div class="newcourse"><button class="newbtn" onclick="showNewCourse()">＋ Neuen Kurs anlegen</button></div>`);}

function showNewCourse(){showScreen(`<button class="crumbs" onclick="showCourses()">← Kurse</button>
  <div class="panel"><h2>Neuen Kurs anlegen</h2><div class="p-sub">Als Kursdirektor: Ablaufplan hochladen, Teilnehmerliste hochladen und eine 10-stellige Instruktoren-PIN vergeben.</div>
   <div class="field"><label>Kursname</label><input type="text" id="ncName" value="ACiLS Providerkurs "></div>
   <div class="field" style="display:flex;gap:12px;flex-wrap:wrap">
     <div style="flex:1;min-width:130px"><label>Datum</label><input type="text" id="ncDate" value=""></div>
     <div style="flex:1;min-width:130px"><label>Ort</label><input type="text" id="ncVenue" value=""></div></div>
   <div class="field"><label>1 · Ablaufplan (PDF/Excel)</label><div class="drop" id="ncDrop" onclick="ncPlan()">📄 Ablaufplan hier ablegen<br><span class="parsehint">liest Vorträge, Szenarien, Workshops, Räume & Instruktoren automatisch ein</span></div></div>
   <div class="field"><label>2 · Teilnehmerliste-PDF (mit Gruppen)</label><div class="drop" id="ncDrop2" onclick="ncList()">📄 Teilnehmerliste ablegen<br><span class="parsehint">wird nach rot/gelb/grün/blau sortiert</span></div></div>
   <div class="field"><label>3 · Instruktoren-PIN (10-stellig)</label><input class="pin" id="ncPin" maxlength="10" value="${Math.floor(1e9+Math.random()*9e9)}">
     <div class="pinhint">Diese PIN teilst du den Instruktoren mit – damit loggen sie sich in den Kurs ein.</div></div>
   <div style="display:flex;gap:10px;margin-top:8px"><button class="btn primary" onclick="createCourse()">Kurs erstellen & Pläne verteilen</button>
     <button class="btn" onclick="showCourses()">Abbrechen</button></div></div>`);}
function ncPlan(){const d=document.getElementById("ncDrop");d.classList.add("ok");d.innerHTML='<strong>Ablaufplan erkannt</strong><br><span class="parsehint">'+SESS.length+' Programmpunkte · '+Object.keys(faculty).length+' Faculty · 4 Räume übernommen</span>';}
function ncList(){const d=document.getElementById("ncDrop2");d.classList.add("ok");d.innerHTML='<strong>Teilnehmerliste erkannt</strong><br><span class="parsehint">24 Teilnehmer nach Gruppen sortiert</span>';}
function createCourse(){const c={id:"k"+(++uid),name:document.getElementById("ncName").value||"Neuer ACiLS-Kurs",
  dates:document.getElementById("ncDate").value||"—",venue:document.getElementById("ncVenue").value||"—",
  pin:document.getElementById("ncPin").value||"0000000000",status:"plan"};
 COURSES.push(c);toast("Kurs erstellt · Instruktoren-PIN "+c.pin);showCourses();}

function showCourseLogin(id){CURRENT=COURSES.find(c=>c.id===id);LOGIN={role:"instructor"};renderLogin();}
function renderLogin(){const c=CURRENT;showScreen(`<button class="crumbs" onclick="showCourses()">← Kurse</button>
  <div class="panel"><h2>${c.name}</h2><div class="p-sub">${c.dates} · ${c.venue}</div>
   <div class="rolepick">
     <button class="${LOGIN.role==='director'?'sel':''}" onclick="setLoginRole('director')">Kursdirektor</button>
     <button class="${LOGIN.role==='instructor'?'sel':''}" onclick="setLoginRole('instructor')">Instruktor</button></div>
   <div id="loginBody"></div></div>`);renderLoginBody();}
function setLoginRole(r){LOGIN.role=r;renderLogin();}
function renderLoginBody(){const c=CURRENT,b=document.getElementById("loginBody");
 const instrs=Object.keys(faculty).filter(n=>faculty[n].role!=="Course Director");
 if(LOGIN.role==="director"){
   b.innerHTML=`<div class="field"><label>Direktoren-Login</label><div class="parsehint" style="margin-top:0">Im Prototyp direkt (Demo). Produktiv: gesichertes Direktoren-Passwort.</div></div>
     <button class="btn primary" style="width:100%" onclick="enterCourse('director')">Als Kursdirektor öffnen</button>`;
 }else{
   b.innerHTML=`<div class="field"><label>Instruktor auswählen (aus dem Plan)</label>
       <select class="big" id="liName">${instrs.map(n=>`<option>${n}</option>`).join("")}</select></div>
     <div class="field"><label>Kurs-PIN (10-stellig)</label><input class="pin" id="liPin" maxlength="10" inputmode="numeric" placeholder="··········">
       <div class="pinhint">Demo-PIN dieses Kurses: <b class="mono">${c.pin}</b></div></div>
     <button class="btn primary" style="width:100%" onclick="tryInstructor()">Anmelden</button>`;}}
function tryInstructor(){if(document.getElementById("liPin").value.trim()!==CURRENT.pin){toast("PIN falsch – bitte erneut versuchen");return;}
 enterCourse(document.getElementById("liName").value);}

function enterCourse(r){IDENT=r;screenEl().classList.add("hide");document.getElementById("app").classList.add("on");
 document.getElementById("ctxCourse").innerHTML=CURRENT.name+"<br>"+CURRENT.dates;applyRole(r);}
const canCD=()=>IDENT==="director"||(faculty[IDENT]&&/Director/.test(faculty[IDENT].role));
function switchView(r){closeMenu();applyRole(r);}
function applyRole(r){ROLE=r;DAY=1;
 document.getElementById("whoName").textContent=isDir()?"Kursdirektion":ROLE;
 const av=document.getElementById("whoAv"),g=isDir()?null:faculty[ROLE].g;
 av.textContent=isDir()?"KD":initials(ROLE);av.style.background=avColors[g];
 buildNav();go(isDir()?"ueb":"tag");}
function buildNav(){const nav=document.getElementById("nav");nav.innerHTML="";
 (isDir()?NAV.director:NAV.instructor).forEach(([k,l])=>{const b=document.createElement("button");b.className="nav";b.dataset.k=k;
  b.innerHTML='<span class="dot"></span>'+l;b.onclick=()=>go(k);nav.appendChild(b);});}
function go(k){document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("active",n.dataset.k===k));
 const map={ueb:"Übersicht",plan:"Ablaufplan (alle Räume)",fb:"Feedback",aus:"Auswertung",cd:"CD-Aufgaben & Checks",mine:"Mein Feedback",upd:"Plan aktualisieren",tag:"Mein Tag",pfad:"Mein Pfad",grp:"Meine Gruppen",chat:"Kurschat",bericht:"Kursbericht",faculty:"Faculty-Übersicht"};
 document.getElementById("viewTitle").textContent=map[k]||"";
 document.getElementById("view").innerHTML=VIEW[k]();if(k==="fb")wireFilters();closeMenu();}
function setMineTab(t){MINE_TAB=t;go("mine");}
function detNotes(f){const keep=(f.text||"").split("  ||  ").filter(s=>s&&!/^(Algorithmus|SET:|DIALOGUE:|CLOSURE:|Stufe )/.test(s));return keep.length?`<div class="detnote">${keep.join(" · ")}</div>`:"";}
function showPersonDetail(name,kind){
 const anon='<div class="parsehint" style="margin:0 0 12px">Alle Rückmeldungen anonym – ohne Angabe der feedbackgebenden Person.</div>';
 const pill=v=>v?`<span class="gradepill" style="background:${noteColor(v)}">${v}</span>`:'<span style="color:var(--faint)">–</span>';
 let body="",sub="";
 if(kind==="tn"){
   const evs=FB.filter(f=>f.type==="eval"&&f.target===name);
   sub="Welche Aufgaben übernommen – Rolle je Session (Teamleitung / Teammitglied) und Bewertung.";
   body=evs.length?evs.map(f=>{const badge=f.role==="TM"?'<span class="rolebadge tm">Teammitglied</span>':(f.role==="TL"?'<span class="rolebadge tl">Teamleitung</span>':"");
     return `<div class="detrow"><div class="deth">${badge}${f.session}${gchip(f.g)}</div>
      <div class="detgr">${TN_POINTS.map(([k,l])=>`<span class="gcell">${l} ${pill(f.grades?f.grades[k]:null)}</span>`).join("")}</div>${detNotes(f)}</div>`;}).join(""):'<div style="color:var(--muted)">Noch keine Einträge.</div>';
 }else{
   const devs=FB.filter(f=>f.type==="dev"&&f.target===name);
   sub="Übernommene Aufgaben je Session – mit Entwicklungsstufe und Noten pro Lehr-Phase.";
   const lab=l=>l.split(" (")[0].replace("Lehrgespräch – ","LG ");
   body=devs.length?devs.map(f=>{
     const st=(typeof f.stage==="number")?(f.stage+1)+" · "+STAGES[f.stage]:"–";
     const phases=DEV_PHASES.map(([code,,cats])=>`<div class="detph"><b>${code}</b>${cats.map(([k,l])=>`<span class="gcell">${lab(l)} ${pill(f.grades?f.grades[k]:null)}</span>`).join("")}</div>`).join("");
     return `<div class="detrow"><div class="deth">${f.session} <span class="chip" style="margin-left:6px">Stufe ${st}</span></div>${phases}${detNotes(f)}</div>`;
   }).join(""):'<div style="color:var(--muted)">Noch keine Einträge.</div>';
 }
 modal(`<div class="mh"><h3>${name}</h3>${kind==="in"&&faculty[name]?`<span class="chip">${faculty[name].role}</span>`:""}<button class="x" onclick="closeModal()">×</button></div>
   <div class="mb"><div class="aggsub" style="margin-top:0">${sub}</div>${anon}${body}</div>
   <div class="mf"><button class="btn primary" onclick="closeModal()">Schließen</button></div>`);

function pfStates(me){
 const o={leit:{},szen:{},ws:{},weitere:{}};
 const ic=pfStufe((faculty[me]||{}).role)==="IC";
 PF_LEIT.forEach(n=>o.leit[n]=0);
 PF_SZEN.forEach(n=>o.szen[n]=0);
 PF_WS.forEach(n=>o.ws[n]=(ic&&PF_WSKRIT.has(n))?"na":0);
 PF_WEITERE.concat([PF_GOLD]).forEach(n=>o.weitere[n]=0);
 FB.filter(f=>f.type==="dev"&&f.target===me).forEach(f=>{
   const s=(f.session||"").toLowerCase();
   const val=(typeof f.stage==="number"&&f.stage>=2)?2:1;
   if(s.includes("set")||s.includes("szenario")){for(const k in PF_MATCH.szen){if(s.includes(k)){const it=PF_MATCH.szen[k];if(o.szen[it]!=="na"&&o.szen[it]<val)o.szen[it]=val;}}}
   if(s.includes("workshop")||s.includes("ws ")){for(const k in PF_MATCH.ws){if(s.includes(k)){const it=PF_MATCH.ws[k];if(o.ws[it]!=="na"&&o.ws[it]<val)o.ws[it]=val;}}}
 });
 const ov=PFAD[me]||{};
 for(const key in ov){const i=key.indexOf("|"),g=key.slice(0,i),n=key.slice(i+1);if(o[g]&&o[g][n]!=="na")o[g][n]=ov[key];}
 return o;
}

 if(m.type==="eval"&&m.scen){

/* ---- Live-Countdown + Vibrationsalarm ---- */
const toMin=hhmm=>{const[a,b]=hhmm.split(":").map(Number);return a*60+b;};
function groupNext(g,afterHHMM){return SESS.filter(s=>s[0]===DAY&&s[7]===g&&s[5]!=="Pause"&&s[1]>=afterHHMM&&s[1]!==undefined).sort((a,b)=>a[1].localeCompare(b[1]))[0];}
function nextAfter(afterHHMM){return SESS.filter(s=>s[0]===DAY&&s[1]>=afterHHMM&&s[5]!=="Pause").sort((a,b)=>a[1].localeCompare(b[1]))[0];}
let CD=null;
function startCountdown(start,end,title,room,g,type){stopCountdown();
 const endM=toMin(end),startM=toMin(start),dur=endM-startM;
 const next = g? groupNext(g,end) : nextAfter(end);
 CD={endM,dur,title,room,g:g||"",type,next,cur:endM-10.5,fired:{}};   // Sim startet 10,5 Min vor Ende
 const w=document.getElementById("cdw");w.classList.remove("hidden");
 document.getElementById("cdwLbl").textContent=title+(room&&room!=="—"?" · "+room:"");
 document.getElementById("cdwNext").textContent=next?("Danach: "+next[1]+" · "+next[3]):"";
 tickCD();
 CD.timer=setInterval(tickCD,250);   // 0,25 Kurs-Min pro Tick → 1 Kurs-Min/Sekunde (beschleunigt)
 toast("⏱ Countdown-Demo läuft (beschleunigt)");}
function stopCountdown(){if(CD&&CD.timer)clearInterval(CD.timer);CD=null;const w=document.getElementById("cdw");if(w){w.classList.add("hidden");w.classList.remove("warn","crit");}}
function tickCD(){if(!CD)return;const rem=CD.endM-CD.cur;
 const w=document.getElementById("cdw");
 const mm=Math.max(0,Math.floor(rem)),ss=Math.max(0,Math.floor((rem-Math.floor(rem))*60));
 document.getElementById("cdwTime").textContent=mm+":"+String(ss).padStart(2,"0");
 const pct=Math.max(0,Math.min(100,rem/Math.max(CD.dur,1)*100));document.getElementById("cdwBar").style.width=pct+"%";
 w.classList.toggle("warn",rem<=5&&rem>1);w.classList.toggle("crit",rem<=1);
 [10,5,1].forEach(m=>{if(!CD.fired[m]&&rem<=m+0.02){CD.fired[m]=1;fireAlert(m);}});
 if(rem<=0&&!CD.fired.end){CD.fired.end=1;fireAlert(0);clearInterval(CD.timer);}
 CD.cur+=0.25;}
function vibe(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function fireAlert(m){
 if(m===10){vibe(350);toast("🔔 Noch 10 Minuten – "+CD.title);}
 else if(m===5){vibe([220,110,220]);toast("🔔 Noch 5 Minuten – "+CD.title);}
 else if(m===1){vibe([200,90,200,90,200]);showNextPopup();}
 else if(m===0){vibe([90,60,90]);toast("⏱ Session zu Ende");}
}
function showNextPopup(){const n=CD.next;let body;
 if(CD.type==="Pause"){body=`<div class="cdbig">Pause – noch 1 Minute</div>
   <div class="cdsub">Dauer: ${CD.dur} Min</div>
   ${n?`<div class="nextbox">Danach weiter um <b>${n[1]}</b><br>${n[4]}<br>Raum: <b>${n[3]}</b>${n[7]?" · Gruppe "+GROUPS[n[7]]:""}</div>`:`<div class="nextbox">Danach: Kursende.</div>`}`;
 }else{body=`<div class="cdbig">Gleich Wechsel – noch 1 Minute</div>
   ${CD.g?`<div class="cdsub">Gruppe ${GROUPS[CD.g]}</div>`:""}
   ${n?`<div class="nextbox">Als Nächstes für die Gruppe:<br><b>${n[4]}</b><br>${n[1]}–${n[2]} · Raum <b>${n[3]}</b></div>`:`<div class="nextbox">Kursende / keine weitere Gruppen-Einheit.</div>`}`;}
 modal(`<div class="mh"><h3>⏱ Nächster Schritt</h3><button class="x" onclick="closeModal()">×</button></div>
   <div class="mb" style="text-align:center">${body}</div>
   <div class="mf"><button class="btn primary" onclick="closeModal()">Verstanden</button></div>`);
 vibe([200,90,200]);}

let tTimer;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(tTimer);tTimer=setTimeout(()=>t.classList.remove("on"),2600);}
